name: LexiMini AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install All Microservice Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiosqlite httpx sqlalchemy pydantic pydantic-settings passlib[bcrypt] python-jose[cryptography] pandas rank-bm25 pypdf python-multipart

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Vector Database Seeding Utility
        run: |
          python scripts/seed_vector_db.py

      - name: Run MLOps Legal Benchmark Evaluation
        run: |
          python mlops/pipelines/eval_benchmarks.py

  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config
