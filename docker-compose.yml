version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leximini-postgres
    environment:
      POSTGRES_DB: leximinidb
      POSTGRES_USER: leximini
      POSTGRES_PASSWORD: leximini_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leximini -d leximinidb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leximini-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: leximini-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  rag_engine:
    build:
      context: .
      dockerfile: services/rag_engine/Dockerfile
    container_name: leximini-rag-engine
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant

  model_server:
    build:
      context: .
      dockerfile: services/model_server/Dockerfile
    container_name: leximini-model-server
    ports:
      - "8002:8002"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: leximini-gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://leximini:leximini_pass@postgres:5432/leximinidb
      - REDIS_URL=redis://redis:6379/0
      - RAG_SERVICE_URL=http://rag_engine:8001
      - MODEL_SERVER_URL=http://model_server:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag_engine:
        condition: service_started
      model_server:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: leximini-web
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
